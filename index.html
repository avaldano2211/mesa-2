<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>Mesa de Mercado 2.0</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mesa 2.0">
<style>
  :root{
    --bg:#0B0E14; --bg2:#0D1119; --card:#141A26; --line:rgba(255,255,255,.07);
    --tx:#E9EDF5; --tx2:#8C96AB; --tx3:#5C6678; --oro:#E7B54D;
    --verde:#45D08C; --rojo:#F26D5F; --azul:#6FA8F5; --morado:#B48CF2; --itm:rgba(111,168,245,.16);
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
    --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  }
  @media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
    --bg:#F7F5F1; --bg2:#FFFFFF; --card:#FFFFFF; --line:rgba(24,32,48,.12);
    --tx:#1B2333; --tx2:#5F6B7E; --tx3:#8A93A5; --oro:#A97A18;
    --verde:#178A54; --rojo:#D5453B; --azul:#2E6BC7; --morado:#6E44C4; --itm:rgba(46,107,199,.11);
  }}
  :root[data-theme="light"]{
    --bg:#F7F5F1; --bg2:#FFFFFF; --card:#FFFFFF; --line:rgba(24,32,48,.12);
    --tx:#1B2333; --tx2:#5F6B7E; --tx3:#8A93A5; --oro:#A97A18;
    --verde:#178A54; --rojo:#D5453B; --azul:#2E6BC7; --morado:#6E44C4; --itm:rgba(46,107,199,.11);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  a{color:var(--oro)}
  .oculto{display:none!important}
  /* ---- login ---- */
  #login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding:32px;gap:18px}
  #login .marca{font-family:'Newsreader',Georgia,serif;font-size:30px;font-weight:600;letter-spacing:.01em}
  #login .sub{color:var(--tx2);font-size:13px;margin-top:-10px}
  #login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:11px;margin-top:8px}
  input{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;color:var(--tx);font-size:15px;font-family:var(--sans);width:100%}
  input:focus{outline:none;border-color:var(--oro)}
  button.pri{background:var(--oro);color:#0B0E14;border:none;border-radius:12px;
    padding:13px;font-size:15px;font-weight:700;font-family:var(--sans);cursor:pointer}
  .err{color:var(--rojo);font-size:12.5px;min-height:16px;text-align:center}
  /* ---- app ---- */
  #app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header.top{padding:calc(env(safe-area-inset-top) + 16px) 20px 10px;display:flex;
    align-items:center;justify-content:space-between}
  header.top .t{font-family:'Newsreader',Georgia,serif;font-size:23px;font-weight:500}
  header.top .fecha{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* rev67: con el botón de la calculadora y la píldora sin partir, a 375 px la fecha se partía («VIERNES, 30 OCT ·» / «NY»)
     y el título bajaba a 2–3 líneas: la cabecera pasaba de 62 a 97 px con el mercado cerrado. Ahora el bloque del título
     cede (min-width:0: si no cabe, se parte el título, no la fecha) y, en pantallas estrechas, la píldora de «en vivo» y
     «mercado cerrado» se queda en su punto (verde / gris: el texto sigue ahí para el lector de pantalla). La de «worker
     caído» y «sin latido» conserva sus palabras: una alarma se lee, no se adivina por un color; con ella, a 320 px (o a 375
     con un «MIÉRCOLES, 30 SEPT»), la fecha se recorta con «…» en vez de partirse o montarse sobre la píldora. */
  header.top{gap:8px}   /* y nunca pegado a la píldora: un título largo (El informe de la mañana) se parte antes de tocarla */
  header.top>div:first-child{min-width:0}
  @media(max-width:400px){#estadoWorker.b-vivo,#estadoWorker.b-cerrado{font-size:0;gap:0;padding:6px}}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
    font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}   /* v65: con la calculadora en la cabecera, la píldora no se parte en dos («sin / latido»): cede el título */
  .dot{width:7px;height:7px;border-radius:99px;flex:none}
  .b-vivo{background:rgba(69,208,140,.13);color:var(--verde)}
  .b-cerrado{background:rgba(140,150,171,.14);color:var(--tx2)}
  .b-caido{background:rgba(242,109,95,.13);color:var(--rojo)}
  main.vista{flex:1;padding:8px 16px 96px;display:flex;flex-direction:column;gap:11px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .card h3{margin:0 0 3px;font-size:15px;font-weight:700}
  .fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .chip{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em}
  .c-op{background:rgba(69,208,140,.13);color:var(--verde)}
  .c-vig{background:rgba(231,181,77,.16);color:var(--oro)}
  .c-esp{background:rgba(140,150,171,.14);color:var(--tx2)}
  .c-vet{background:rgba(242,109,95,.13);color:var(--rojo)}
  .sec{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--tx2);margin:6px 2px 2px}
  .mut{color:var(--tx2);font-size:12.5px;line-height:1.45}
  .mono{font-family:var(--mono)}
  .tend{display:flex;gap:5px;flex-wrap:wrap}
  .tg{font-size:10.5px;color:var(--tx2)}
  .tg b{color:var(--tx)}
  .vacio{text-align:center;color:var(--tx3);font-size:12.5px;padding:14px}
  /* nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;
    display:flex;justify-content:space-between;padding:9px 16px calc(env(safe-area-inset-bottom) + 12px);
    border-top:1px solid var(--line);background:var(--bg2)}
  nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--tx2);text-decoration:none;font-size:9.5px;font-weight:600}
  nav.tabs a.on{color:var(--oro)}
  nav.tabs svg{width:22px;height:22px}
  .prox{text-align:center;color:var(--tx3);padding:60px 24px;font-size:13.5px;line-height:1.6}
  .fresco{font-size:10px;color:var(--tx3)}
  button.pri{cursor:pointer}
  .btnsec{flex:1;background:transparent;border:1px solid var(--line);color:var(--tx);
    border-radius:11px;padding:10px;font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer}
  .btnsec:active{background:var(--card)}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .hoja{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;
    width:100%;max-width:440px;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);
    display:flex;flex-direction:column;gap:6px;max-height:92dvh;overflow:auto}
  .hoja h3{font-size:16px;font-weight:700}
  .hoja label{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--tx2);margin:8px 2px 1px}
  .hoja input,.hoja select{background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:12px;color:var(--tx);font-size:15px;font-family:var(--sans);width:100%}
  .hoja input:focus,.hoja select:focus{outline:none;border-color:var(--oro)}
  .hoja .dos{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .gtcprev{margin-top:10px;padding:11px 12px;border-radius:11px;background:rgba(231,181,77,.12);
    border:1px solid rgba(231,181,77,.3);color:var(--oro);font-family:var(--mono);font-size:13px;font-weight:700;text-align:center}
  .rango{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;
    font-size:11px;color:var(--tx2)}
  .rango b{color:var(--oro);font-size:13px}
  .rangohint{margin-top:9px;padding:9px 11px;border-radius:10px;font-size:12px;text-align:center;
    background:var(--card);border:1px solid var(--line);color:var(--tx2)}
  .rangohint[data-n="ok"]{background:rgba(69,208,140,.12);border-color:rgba(69,208,140,.3);color:var(--verde)}
  .rangohint[data-n="aviso"]{background:rgba(231,181,77,.12);border-color:rgba(231,181,77,.3);color:var(--oro)}
  .rangohint[data-n="alto"]{background:rgba(242,109,95,.12);border-color:rgba(242,109,95,.3);color:var(--rojo)}
  .rangohint b{font-weight:700}
  .periodos{display:flex;gap:7px;margin:2px 0 2px}
  .perbtn{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx2);
    border-radius:11px;padding:9px;font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer}
  .perbtn.on{background:var(--oro);border-color:var(--oro);color:#0B0E14}
  .hist{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}
  .hist>div{display:flex;flex-direction:column;gap:1px}
  .hist span{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase}
  .hist b{font-size:12.5px;font-weight:600}
  .cfg{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:999px;
    width:32px;height:32px;font-size:15px;line-height:1;cursor:pointer;flex:none;padding:0}
  .cfg:active{background:var(--card)}
  .cfg svg{display:block;margin:auto}
  /* v65 · CALCULADORA DE LIMIT Y STOP (Andrés 2026-10-30): una hoja como la del fill o la orden. Los números van en mono
     tabular (las cifras no bailan al teclear); los campos a 16 px (por debajo Safari en el iPhone amplía la página al
     enfocarlos y no vuelve solo). El LIMIT en oro y grande, el STOP en rojo; colores de la app (claro y oscuro). */
  .hoja.calc:focus{outline:none}   /* rev67: en el teléfono el foco entra en la hoja misma (tabindex=-1, sin sacar el teclado): sin marco alrededor del cuadro */
  .calc .clotes{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .calc .clote{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,1.4fr) 40px;gap:7px;align-items:center}
  .calc .clote.cab span{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase}
  .calc .cnum{font-family:var(--mono);font-size:12px;color:var(--tx3);text-align:center}
  .calc input{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;padding:10px 11px;min-width:0}
  .calc .cquitar{height:40px;background:transparent;border:1px solid var(--line);border-radius:11px;color:var(--tx2);font-size:18px;line-height:1;cursor:pointer;padding:0}
  .calc .cquitar:disabled{opacity:.35;cursor:default}
  .calc .cseg{display:inline-flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;flex:none}
  .calc .cseg button{background:transparent;border:0;color:var(--tx2);border-radius:8px;padding:8px 14px;font:700 13px var(--sans);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .calc .cseg button.on{background:var(--oro);color:#0B0E14}
  .calc .dos .cseg{display:flex;margin-top:0}
  .calc .dos .cseg button{flex:1}
  .calc .chips .chip2{font-family:var(--mono);padding:8px 11px}
  .calc .cres{margin-top:10px;padding:12px 13px;border-radius:13px;background:rgba(231,181,77,.08);border:1px solid rgba(231,181,77,.35)}
  .calc .cres.cstop{margin-top:6px;background:rgba(242,109,95,.06);border-color:rgba(242,109,95,.35)}
  .calc .cprecio{font:700 40px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--oro);letter-spacing:-.02em;margin-top:4px;overflow-wrap:anywhere}
  .calc .cstop .cprecio{color:var(--rojo)}
  .calc .cprecio small{font-size:12.5px;font-weight:600;color:var(--tx2);letter-spacing:0;margin-left:8px;white-space:nowrap}
  .calc .cnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin-top:8px}
  .calc .cnums span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase}
  .calc .cnums b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;overflow-wrap:anywhere}
  .calc .cnums i{display:block;font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;margin-top:1px}
  .calc .cbtns{display:flex;gap:8px;margin-top:10px}
  .calc .cbtns>button{flex:1;padding:11px}
  .calc #cResumen b{color:var(--tx);font-variant-numeric:tabular-nums}
  .calc .cform{margin-top:10px;font-size:12px;color:var(--tx2)}
  .calc .cform summary{cursor:pointer;color:var(--oro);font-weight:600;padding:6px 0;-webkit-tap-highlight-color:transparent}
  .calc .cformula{font:11.5px/1.6 var(--mono);font-variant-numeric:tabular-nums;white-space:pre;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  /* órdenes E*TRADE */
  .aviso{margin-top:10px;padding:10px 12px;border-radius:11px;background:rgba(231,181,77,.12);
    border:1px solid rgba(231,181,77,.35);color:var(--oro);font-size:12.5px;line-height:1.45}
  .aviso .check{display:flex;gap:8px;align-items:center;margin:8px 0 0;font-size:13px;font-weight:700;
    letter-spacing:0;color:var(--tx);cursor:pointer}
  .aviso .check input{width:auto;height:auto;margin:0;accent-color:var(--oro)}
  .cadena{margin-top:10px;padding:9px 10px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:12px}
  .cadena table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
  .cadena th{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase;padding:2px 4px;text-align:center}
  .cadena th:first-child,.cadena td:first-child{text-align:left}
  .cadena th:last-child,.cadena td:last-child{text-align:right}
  .cadena td{padding:6px 4px;border-top:1px solid var(--line);white-space:nowrap}
  .cadena td.k{text-align:center;font-weight:700;color:var(--tx)}
  .cadena td.cel{cursor:pointer}
  .cadena td.cel small{color:var(--tx3);font-size:9.5px}
  .cadena td.cel small.sp{color:var(--rojo);font-weight:700}
  .cadena td.itm{background:var(--itm)}
  .cadena td.en-rango{color:var(--oro);font-weight:700}
  .cadena td.en-rango:not(.itm){background:rgba(231,181,77,.16)}
  .cadena td.borde:not(.itm){background:rgba(231,181,77,.07)}
  .cadena td.itm.en-rango{box-shadow:inset 0 0 0 1.5px var(--oro)}
  .cadena tr.atm td.k{color:var(--oro)}
  .cadena tr.atm-linea td{padding:0;height:0;border-top:2px solid var(--oro);text-align:center;line-height:0}
  .cadena tr.atm-linea span{display:inline-block;background:var(--card);color:var(--oro);font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:0 7px;line-height:13px;transform:translateY(-7px);border:1px solid var(--oro);border-radius:8px}
  .cadena .leyenda .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;border:1px solid var(--line)}
  .cadena .leyenda .sw.itm{background:var(--itm)}
  .cadena .leyenda .sw.otm{background:transparent}
  .cadena .leyenda .sw.rango{background:rgba(231,181,77,.16);border-color:var(--oro)}
  .prevbox{margin-top:10px;padding:11px 12px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13px}
  .prevbox .fila{padding:2px 0}
  .hoja input.pin{text-align:center;letter-spacing:.3em;font-size:18px}
  .hoja input:disabled,.hoja select:disabled{opacity:.55}
  .sec a{color:var(--oro);text-decoration:none;font-size:11px;letter-spacing:0}
  /* señales de hoy: Quitar / Restaurar (v49) */
  .sec .acc{display:inline-flex;align-items:center;gap:24px;flex:none}
  .sec .acc a{display:inline-block;padding:10px 0;margin:-10px 0}
  @media (max-width:380px){.sec .acc{gap:18px}}   /* a 375 px el encabezado del Informe cabe en 1 línea */
  .btnquitar{flex:none;background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:999px;
    min-height:32px;padding:0 12px;font-size:12px;font-weight:600;font-family:var(--sans);cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .btnquitar:active{background:var(--line)}
  .btnquitar:disabled{opacity:.6;cursor:default}
  .card.quitada{background:transparent;border-style:dashed}
  .card.quitada .tenue{opacity:.55}
  .card.quitada .btnquitar,.vacio .btnquitar{color:var(--oro);border-color:rgba(231,181,77,.45)}
  /* v66 (A1): la franja discreta de «versión nueva» (arriba, justo debajo de la cabecera para no tapar ⚙ ni la calculadora, y
     por encima de un cuadro abierto: .modal es 50-60) con «Actualizar ahora» y ✕, y la marca «v65 → v66» junto a la fecha de
     la cabecera (solo mientras haya una pendiente) */
  .vernueva{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);z-index:70;
    display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;
    background:var(--card);color:var(--tx);border:1px solid rgba(231,181,77,.45);border-radius:12px;
    padding:7px 8px 7px 12px;font-size:12px;font-weight:600;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .vernueva span{flex:1;min-width:0}
  .vernueva button{flex:none;background:var(--oro);color:#0B0E14;border:0;border-radius:9px;padding:7px 10px;
    font:700 12px var(--sans);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .vernueva .vercerrar{background:transparent;color:var(--tx2);padding:7px 6px;font-size:13px}
  .vercab{color:var(--oro);margin-right:6px;letter-spacing:.02em}
  /* v68 A: la franja «bróker sin conexión» (#avisoBrk, la pone main.js entre la cabecera y la vista: en TODAS las pestañas),
     una línea por bróker: roja (más de 1 día hábil sin sincronizar) o ámbar (falta el login de hoy), con «Conectar» y
     «Ocultar hasta mañana». A 375 px el texto se parte y los botones bajan a su fila: sin desborde lateral. */
  .avbrk{margin:2px 16px 4px;display:flex;flex-direction:column;gap:8px}
  .avbrk:empty{display:none}
  .avl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.45;
    color:var(--tx);background:rgba(242,109,95,.10);border:1px solid rgba(242,109,95,.5)}
  .avl.ambar{background:rgba(231,181,77,.10);border-color:rgba(231,181,77,.55)}
  .avl .avt{flex:1 1 260px;min-width:0;overflow-wrap:anywhere}
  .avl .avtit{color:var(--rojo)}
  .avl.ambar .avtit{color:var(--oro)}
  .avl .avf{display:block;color:var(--tx2);font-size:11.5px;margin-top:2px}
  .avl .avb{display:flex;flex-wrap:wrap;gap:6px;flex:0 1 auto;max-width:100%}
  .avl .avc{background:var(--oro);color:#0B0E14;border:0;border-radius:9px;padding:8px 12px;font:700 12.5px var(--sans);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .avl .avo{background:transparent;color:var(--tx2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:600 12px var(--sans);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  @media (min-width:900px){#app.ancho .avbrk{margin:2px 24px 4px}}
  /* rev68 (revisor de A1): con la franja a la vista (body.con-vernueva, --vernueva-alto = su alto medido), el cuadro abierto
     empieza DEBAJO de ella: tapaba la primera banda de las hojas altas (el ✕ de la calculadora, el título del formulario de
     orden). La hoja cabe en lo que queda (max-height 100% del .modal, sin pasar del 92dvh de siempre) */
  body.con-vernueva .modal{padding-top:calc(env(safe-area-inset-top) + 72px + var(--vernueva-alto,48px))}
  body.con-vernueva .modal>.hoja{max-height:min(92dvh,100%)}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:60;
    background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.3);animation:fade .15s ease}
  /* charts de Tickers (velas + Bollinger + H-lines) */
  .chart{margin-top:9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .chart .fila{margin-bottom:4px}
  .chart svg{display:block;width:100%;height:auto;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
  .chart svg text{font-family:var(--mono);font-size:9px}
  .chart .vacio{padding:26px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
  /* v67 rev69 (juez, iPhone 375 px: «lejos del precio: fuera de este gráfico · el más optimista de los analistas» con nowrap
     desbordaba la hoja y aplastaba el nombre en «target / alto / 250.00»): el NOMBRE de la línea nunca se parte; el
     subtítulo, si no cabe al lado, baja a su propia fila (flex-wrap), alineado a la derecha, y se parte por palabras */
  .hl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
  .hl:first-child{border-top:none}
  .hl i{display:inline-block;width:14px;height:0;border-top:2px solid currentColor;vertical-align:middle;margin-right:7px}
  .hl>span:first-child{white-space:nowrap}
  .hl .fresco{text-align:right;margin-left:auto;min-width:0;overflow-wrap:anywhere}
  /* v67: la muestra de una línea del gráfico fuera de él (lista H-LINES, leyenda del gestor): un trocito del lienzo oscuro
     (el fondo va en línea, CHART_COL.lienzo) con la línea en su color y su trazo, igual en tema claro y oscuro */
  .hl i.chsw,.gleg span i.chsw,i.chsw{display:inline-block;width:24px;height:11px;border:0;border-radius:3px;vertical-align:middle;
    margin-right:7px;flex:none;background-size:18px 2px;background-position:center;background-repeat:no-repeat}
  i.chsw{background-image:linear-gradient(currentColor,currentColor)}
  i.chsw[data-trazo="guiones"]{background-image:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 7px)}
  i.chsw[data-trazo="puntos"]{background-image:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 4px)}
  i.chsw[data-trazo="rayaPunto"]{background-image:repeating-linear-gradient(90deg,currentColor 0 7px,transparent 7px 9px,currentColor 9px 11px,transparent 11px 13px)}
  .hl.mut{font-size:11px;padding:3px 0}
  .hl.fuera>span:first-child{opacity:.6}
  /* v58: editor de tickers EN la pestaña Tickers (agregar / reactivar / quitar) y el botón «Extendido».
     El campo va a 16 px: por debajo Safari en el iPhone amplía la página al enfocarlo y no vuelve solo. */
  .tkedit{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:2px 0}
  .tkedit input{flex:1 1 150px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px;color:var(--tx);font-size:16px;font-family:var(--sans)}
  .tkedit .btnsec{flex:none;padding:9px 12px}
  .tkedit .err{flex:1 1 100%;text-align:left;min-height:0}
  .tkedit .err:empty{display:none}

  .tkder{display:flex;align-items:center;flex:none}
  .tkquitar{flex:none;background:transparent;border:1px solid var(--line);color:var(--tx3);border-radius:9px;padding:4px 8px;font-size:12px;cursor:pointer;margin-left:8px}
  .tkquitar:active{background:var(--card)}
  .tkconf .mut{color:var(--tx)}
  .perbtn:disabled{opacity:.45;cursor:not-allowed}
  /* Diario (v52): tablas compactas con scroll horizontal, chips de período y notas */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
  .tbl{width:100%;border-collapse:collapse;font-size:11.5px;white-space:nowrap}
  .tbl th{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase;text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}
  .tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono)}

  .tbl th:first-child,.tbl td:first-child{text-align:left;font-family:var(--sans)}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip2{background:var(--card);border:1px solid var(--line);color:var(--tx2);border-radius:999px;padding:9px 12px;font-size:11.5px;font-weight:600;font-family:var(--sans);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .chip2.on{background:var(--oro);border-color:var(--oro);color:#0B0E14}
  .chip2 small{font-weight:600;margin-left:5px;font-size:10.5px}
  /* 16 px: por debajo, Safari en el iPhone amplía la página al enfocar el campo y no vuelve solo */
  .card textarea{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--tx);font-size:16px;line-height:1.45;font-family:var(--sans);width:100%;min-height:76px;resize:vertical}
  .card textarea:focus{outline:none;border-color:var(--oro)}
  .card select,.card input[type=date]{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--tx);font-size:16px;font-family:var(--sans);width:100%;min-width:0}
  .tbl-dias td{padding:7px 4px}
  /* enlaces pequeños con área de toque de 32 px sin cambiar el texto */
  a.lnk{display:inline-block;padding:10px 8px;margin:-10px -2px;font-size:12px}
  #tkSym::placeholder{text-transform:none}
  /* Diario v55: igual a la mesa vieja. En pantallas anchas el envoltorio se ensancha solo con el Diario
     (#app.ancho); dentro, .diario es un contenedor (@container) y su CSS reacciona al ancho REAL que tiene:
     en el iPhone tarjetas a dos columnas e historial apilado; en el Mac fila de tarjetas y una sola línea. */
  @media (min-width:900px){#app.ancho{max-width:1180px} #app.ancho main.vista{padding:8px 24px 96px}}
  /* v57: la pestaña TICKERS en GRANDE en pantallas anchas (Andrés 2026-09-29, desde el laptop: «están muy
     chiquitos»): el envoltorio crece hasta 1560 px, las tarjetas van en rejilla (2 columnas desde ~1230 px,
     3 desde ~1850), el gráfico se dibuja con un viewBox más ancho y alto (velas más grandes y legibles) y la
     tipografía sube un escalón. En el iPhone nada cambia. La hoja del gráfico (#modalChart) también crece. */
  @media (min-width:900px){

    #app.tk main.vista{display:grid;grid-template-columns:repeat(auto-fit,minmax(600px,1fr));gap:14px;align-content:start;padding:8px 24px 96px}
    #app.tk main.vista>#chartSel{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap}
    #app.tk main.vista>#chartSel .periodos{flex:1 1 340px;margin:0}
    #app.tk main.vista>#chartSel .tkedit{flex:1 1 100%}

    #app.tk .tg{font-size:14.5px}
    #app.tk .tend{gap:12px}
    #app.tk .rango{gap:10px;margin-top:10px}
    #app.tk .rango>span:first-child{font-size:14px}
    #app.tk .rango b{font-size:22px}
    #app.tk .fresco{font-size:12.5px}
    #app.tk .mut{font-size:14px}
    #app.tk .chart{margin-top:12px}

  }
  .diario{display:flex;flex-direction:column;gap:11px;container-type:inline-size}

     computadora»). En el teléfono: tiles a 2 columnas (.dcards), «por activo» y «por bróker» apilados y el historial en
     tarjetas con el desglose plegable. En la computadora (≥ 900 px, #app.ancho.cta hasta 1560 px, v62 rev2): brókeres en rejilla,

     v62 rev2: en la tabla, Acción / Strike vs acción / Señal / P&L van en CORTO (una línea .c1 sin partir y, debajo, las

  .ctav{display:flex;flex-direction:column;gap:11px}

  .dcard .vl.vl2{font-size:15px}
  /* v62 rev: «MEJOR / PEOR» a 1400 px cortaba la cifra («$530 / -$1,…», que se lee −$1): los dos valores parten en la «/»

  .ctav .dcard .vl.vl2{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}

  .cdesg .tbl td,.cdesg .tbl th{padding:6px 5px}

  .ctav .hist b span{font-size:10px;font-weight:500;letter-spacing:0;text-transform:none}   /* «(15 min)» dentro de un dato no es una etiqueta */
  .ctasen>span:first-child{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase;margin-right:7px}
  .ctram{margin-top:8px;font-size:11.5px;color:var(--tx2)}
  .ctram summary{cursor:pointer;color:var(--oro);font-weight:600;padding:6px 0;-webkit-tap-highlight-color:transparent}
  .ctramo{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,.5fr) minmax(0,1.4fr) minmax(0,1fr);gap:6px;padding:5px 0;border-top:1px solid var(--line)}
  .ctramo b{text-align:right}
  .ctramo .ctspot{grid-column:1/-1;font-size:10.5px;color:var(--tx3);margin-top:-3px}   /* v62 rev: la acción de ESA ida y vuelta */
  .ctabla{padding:0 8px 8px;overflow:auto;max-height:calc(100dvh - 110px);overscroll-behavior-x:contain}
  .ctbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
  .ctbl th{position:sticky;top:0;z-index:2;background:var(--card);font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--tx3);text-transform:uppercase;text-align:right;padding:8px 4px 6px;border-bottom:1px solid var(--line);vertical-align:bottom}

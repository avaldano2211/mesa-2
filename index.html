<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>Mesa 2.0</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mesa 2.0">
<style>
  :root{
    --bg:#0B0E14; --bg2:#0D1119; --card:#141A26; --line:rgba(255,255,255,.07);
    --tx:#E9EDF5; --tx2:#8C96AB; --tx3:#5C6678; --oro:#E7B54D;
    --verde:#45D08C; --rojo:#F26D5F; --azul:#6FA8F5;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
    --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  }
  @media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
    --bg:#F7F5F1; --bg2:#FFFFFF; --card:#FFFFFF; --line:rgba(24,32,48,.12);
    --tx:#1B2333; --tx2:#5F6B7E; --tx3:#8A93A5; --oro:#A97A18;
    --verde:#178A54; --rojo:#D5453B; --azul:#2E6BC7;
  }}
  :root[data-theme="light"]{
    --bg:#F7F5F1; --bg2:#FFFFFF; --card:#FFFFFF; --line:rgba(24,32,48,.12);
    --tx:#1B2333; --tx2:#5F6B7E; --tx3:#8A93A5; --oro:#A97A18;
    --verde:#178A54; --rojo:#D5453B; --azul:#2E6BC7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  a{color:var(--oro)}
  .oculto{display:none!important}
  /* ---- login ---- */
  #login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding:32px;gap:18px}
  #login .marca{font-family:'Newsreader',Georgia,serif;font-size:30px;font-weight:600;letter-spacing:.01em}
  #login .sub{color:var(--tx2);font-size:13px;margin-top:-10px}
  #login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:11px;margin-top:8px}
  input{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;color:var(--tx);font-size:15px;font-family:var(--sans);width:100%}
  input:focus{outline:none;border-color:var(--oro)}
  button.pri{background:var(--oro);color:#0B0E14;border:none;border-radius:12px;
    padding:13px;font-size:15px;font-weight:700;font-family:var(--sans);cursor:pointer}
  .err{color:var(--rojo);font-size:12.5px;min-height:16px;text-align:center}
  /* ---- app ---- */
  #app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header.top{padding:calc(env(safe-area-inset-top) + 16px) 20px 10px;display:flex;
    align-items:center;justify-content:space-between}
  header.top .t{font-family:'Newsreader',Georgia,serif;font-size:23px;font-weight:500}
  header.top .fecha{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--tx2)}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
    font-size:11px;font-weight:700;letter-spacing:.02em}
  .dot{width:7px;height:7px;border-radius:99px;flex:none}
  .b-vivo{background:rgba(69,208,140,.13);color:var(--verde)}
  .b-cerrado{background:rgba(140,150,171,.14);color:var(--tx2)}
  .b-caido{background:rgba(242,109,95,.13);color:var(--rojo)}
  main.vista{flex:1;padding:8px 16px 96px;display:flex;flex-direction:column;gap:11px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .card h3{margin:0 0 3px;font-size:15px;font-weight:700}
  .fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .chip{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em}
  .c-op{background:rgba(69,208,140,.13);color:var(--verde)}
  .c-vig{background:rgba(231,181,77,.16);color:var(--oro)}
  .c-esp{background:rgba(140,150,171,.14);color:var(--tx2)}
  .c-vet{background:rgba(242,109,95,.13);color:var(--rojo)}
  .sec{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--tx2);margin:6px 2px 2px}
  .mut{color:var(--tx2);font-size:12.5px;line-height:1.45}
  .mono{font-family:var(--mono)}
  .tend{display:flex;gap:5px;flex-wrap:wrap}
  .tg{font-size:10.5px;color:var(--tx2)}
  .tg b{color:var(--tx)}
  .vacio{text-align:center;color:var(--tx3);font-size:12.5px;padding:14px}
  /* nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;
    display:flex;justify-content:space-between;padding:9px 16px calc(env(safe-area-inset-bottom) + 12px);
    border-top:1px solid var(--line);background:var(--bg2)}
  nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--tx2);text-decoration:none;font-size:9.5px;font-weight:600}
  nav.tabs a.on{color:var(--oro)}
  nav.tabs svg{width:22px;height:22px}
  .prox{text-align:center;color:var(--tx3);padding:60px 24px;font-size:13.5px;line-height:1.6}
  .fresco{font-size:10px;color:var(--tx3)}
  button.pri{cursor:pointer}
  .btnsec{flex:1;background:transparent;border:1px solid var(--line);color:var(--tx);
    border-radius:11px;padding:10px;font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer}
  .btnsec:active{background:var(--card)}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .hoja{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;
    width:100%;max-width:440px;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);
    display:flex;flex-direction:column;gap:6px;max-height:92dvh;overflow:auto}
  .hoja h3{font-size:16px;font-weight:700}
  .hoja label{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--tx2);margin:8px 2px 1px}
  .hoja input,.hoja select{background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:12px;color:var(--tx);font-size:15px;font-family:var(--sans);width:100%}
  .hoja input:focus,.hoja select:focus{outline:none;border-color:var(--oro)}
  .hoja .dos{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .gtcprev{margin-top:10px;padding:11px 12px;border-radius:11px;background:rgba(231,181,77,.12);
    border:1px solid rgba(231,181,77,.3);color:var(--oro);font-family:var(--mono);font-size:13px;font-weight:700;text-align:center}
  .rango{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;
    font-size:11px;color:var(--tx2)}
  .rango b{color:var(--oro);font-size:13px}
  .rangohint{margin-top:9px;padding:9px 11px;border-radius:10px;font-size:12px;text-align:center;
    background:var(--card);border:1px solid var(--line);color:var(--tx2)}
  .rangohint[data-n="ok"]{background:rgba(69,208,140,.12);border-color:rgba(69,208,140,.3);color:var(--verde)}
  .rangohint[data-n="aviso"]{background:rgba(231,181,77,.12);border-color:rgba(231,181,77,.3);color:var(--oro)}
  .rangohint[data-n="alto"]{background:rgba(242,109,95,.12);border-color:rgba(242,109,95,.3);color:var(--rojo)}
  .rangohint b{font-weight:700}
  .periodos{display:flex;gap:7px;margin:2px 0 2px}
  .perbtn{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx2);
    border-radius:11px;padding:9px;font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer}
  .perbtn.on{background:var(--oro);border-color:var(--oro);color:#0B0E14}
  .hist{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}
  .hist>div{display:flex;flex-direction:column;gap:1px}
  .hist span{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase}
  .hist b{font-size:12.5px;font-weight:600}
  .cfg{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:999px;
    width:32px;height:32px;font-size:15px;line-height:1;cursor:pointer;flex:none;padding:0}
  .cfg:active{background:var(--card)}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:60;
    background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.3);animation:fade .15s ease}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
</head>
<body>
  <section id="login">
    <div class="marca">Mesa 2.0</div>
    <div class="sub">Tu analista Sardiñas</div>
    <form id="loginForm">
      <input id="email" type="email" placeholder="correo" autocomplete="username" required>
      <input id="pass" type="password" placeholder="contraseña" autocomplete="current-password" required>
      <button class="pri" type="submit">Entrar</button>
      <div class="err" id="loginErr"></div>
    </form>
  </section>

  <div id="app" class="oculto">
    <header class="top">
      <div>
        <div class="fecha" id="fecha">—</div>
        <div class="t" id="titulo">El informe de la mañana</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="badge b-cerrado" id="estadoWorker"><span class="dot" style="background:var(--tx2)"></span>—</span>
        <button class="cfg" type="button" onclick="MZ.abrirCuenta()" aria-label="Tu cuenta" title="Tu cuenta">⚙</button>
      </div>
    </header>
    <main class="vista" id="vista"></main>
    <nav class="tabs" id="nav"></nav>
  </div>

  <script src="./vendor/supabase.js"></script>
  <script src="./config.js?v=11"></script>
  <script src="./app/main.js?v=11"></script>
</body>
</html>
